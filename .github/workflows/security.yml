name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v4.37.3
      - uses: github/codeql-action/analyze@v4.37.3

  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan credentials and documentation local paths
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=dist --exclude='*.pyc' \
            'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' .; then
            echo "credential pattern found in repository" >&2
            exit 1
          fi
          if grep -RInE --include='*.md' 'C:\\Users\\|/Users/|[A-Za-z]:\\|AppData' \
            README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md docs/; then
            echo "local path pattern found in documentation" >&2
            exit 1
          fi
          echo "security scan: clean"
